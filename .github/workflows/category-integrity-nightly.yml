name: Category integrity nightly

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test category integrity rules
        run: npm test -- src/server/knowledge/__tests__/category-integrity.test.ts
      - name: Require read-only diagnostic connection
        env:
          DATABASE_URL: ${{ secrets.CATEGORY_DIAGNOSTIC_DATABASE_URL }}
        run: test -n "$DATABASE_URL"
      - name: Audit category counts
        env:
          DATABASE_URL: ${{ secrets.CATEGORY_DIAGNOSTIC_DATABASE_URL }}
        run: npm run check:category-integrity -- --summary

name: Daily assignments (external cron)

# Why this exists:
# The Vercel Hobby plan caps the number of cron jobs and uses best-effort
# timing, so the daily pre-build (/api/cron/daily-assignments) can silently
# fail to fire — leaving today's per-user queues unbuilt, which forces /daily
# into synchronous LLM generation and surfaces as 503s. GitHub Actions is a
# free, reliable scheduler, so we drive the existing (idempotent, bearer-authed)
# cron route from here instead of relying on Vercel's Hobby cron scheduler.
#
# Setup required (one time):
#   - Add repo secret CRON_SECRET (Settings > Secrets and variables > Actions)
#     set to the SAME value as the production CRON_SECRET env var in Vercel.
#   - This workflow only runs on a schedule once it's on the default branch (main).
#     Until then, use "Run workflow" (workflow_dispatch) from the Actions tab.
#
# The route is idempotent (skips users whose queue already exists), so it's safe
# if Vercel's own cron also happens to fire — no double-build.

on:
  schedule:
    # 17:05 UTC — just after the 17:00 UTC daily reset (DAILY_RESET_HOUR_UTC).
    # GitHub schedules are also best-effort and may lag a few minutes; fine for
    # a once-daily pre-build of a 24h window.
    - cron: '5 17 * * *'
  workflow_dispatch: {}

# Don't pile up overlapping runs.
concurrency:
  group: daily-assignments
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger daily-assignments pre-build
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          TARGET_URL: https://joshing-11.vercel.app/api/cron/daily-assignments
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/cron-out.json -w '%{http_code}' \
            --max-time 300 --retry 2 --retry-delay 30 --retry-all-errors \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${TARGET_URL}")
          echo "HTTP ${code}"
          echo "Response body:"
          cat /tmp/cron-out.json || true
          echo
          # Fail the job on a non-200 so GitHub notifies on a missed pre-build.
          test "${code}" = "200"

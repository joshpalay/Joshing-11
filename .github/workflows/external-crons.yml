name: External crons (Hobby workaround)

# Why this exists:
# The Vercel Hobby plan caps the number of cron jobs and uses best-effort
# timing, so the project's crons (it declares 4) can silently fail to fire.
# For daily-assignments that means today's per-user queues never get pre-built,
# /daily falls back to synchronous LLM generation, and users hit 503s.
# GitHub Actions is a free, reliable scheduler, so we drive the existing
# (idempotent, bearer-authed) cron routes from here instead.
#
# One-time setup:
#   - Add repo secret CRON_SECRET (Settings > Secrets and variables > Actions)
#     equal to the production CRON_SECRET env var in Vercel.
#   - Scheduled runs only fire once this file is on the default branch (main).
#     Before then (or any time), use Actions > "External crons" > Run workflow.
#
# The routes are idempotent, so if a Vercel Hobby cron also happens to fire,
# there is no double work.
#
# REVERT NOTE (2026-05-30): /api/cron/daily-assignments was REMOVED from
# vercel.json — it's the only cron that also sends SMS (NOT idempotent), so a
# Hobby cron firing it alongside this workflow could double-text users. GitHub
# Actions is now its sole scheduler; the other three crons remain in vercel.json
# as fallback. To restore the Vercel scheduler for it, re-add to vercel.json
# "crons":  { "path": "/api/cron/daily-assignments", "schedule": "5 17 * * *" }
# and remove the '5 17 * * *' entry below to avoid duplicate runs/SMS.
#
# UPDATE (2026-06-10): the route now gates its SMS/email nudge on having
# freshly built the user's queue in that invocation, so curl's retries below
# (which replay the whole run if the request times out while the function is
# still working) can no longer double-text users nudged by a previous attempt.
# Keep the single-scheduler rule above anyway — two schedulers racing the
# same minute could still both see "no queue yet" for the same user.

on:
  schedule:
    - cron: '5 17 * * *'   # /api/cron/daily-assignments  (after 17:00 UTC reset)
    - cron: '0 8 * * *'    # /api/cron/weekly-ceremony
    - cron: '0 7 * * *'    # /api/cron/vet-questions
    - cron: '30 6 * * *'   # /api/cron/expire-friend-requests
  workflow_dispatch:
    inputs:
      route:
        description: Which cron route to run
        type: choice
        default: all
        options:
          - all
          - daily-assignments
          - weekly-ceremony
          - vet-questions
          - expire-friend-requests

concurrency:
  group: external-crons-${{ github.event.schedule || github.event.inputs.route || 'all' }}
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://joshing-11.vercel.app
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      EVENT_SCHEDULE: ${{ github.event.schedule }}
      DISPATCH_ROUTE: ${{ github.event.inputs.route }}
    steps:
      - name: Select route(s)
        id: select
        run: |
          set -euo pipefail
          case "${EVENT_SCHEDULE}" in
            "5 17 * * *") routes="daily-assignments" ;;
            "0 8 * * *")  routes="weekly-ceremony" ;;
            "0 7 * * *")  routes="vet-questions" ;;
            "30 6 * * *") routes="expire-friend-requests" ;;
            *)
              # Manual run (workflow_dispatch): honor the chosen input, default all.
              if [ -z "${DISPATCH_ROUTE}" ] || [ "${DISPATCH_ROUTE}" = "all" ]; then
                routes="daily-assignments weekly-ceremony vet-questions expire-friend-requests"
              else
                routes="${DISPATCH_ROUTE}"
              fi
              ;;
          esac
          echo "routes=${routes}" >> "$GITHUB_OUTPUT"
          echo "Selected: ${routes}"
      - name: Trigger cron route(s)
        run: |
          set -euo pipefail
          fail=0
          for r in ${{ steps.select.outputs.routes }}; do
            echo "==> /api/cron/${r}"
            code=$(curl -sS -o /tmp/out.json -w '%{http_code}' \
              --max-time 300 --retry 2 --retry-delay 30 --retry-all-errors \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              "${BASE_URL}/api/cron/${r}")
            echo "HTTP ${code}"
            cat /tmp/out.json 2>/dev/null || true
            echo
            [ "${code}" = "200" ] || fail=1
          done
          # Fail the job (GitHub notifies) if any route returned non-200.
          exit "${fail}"

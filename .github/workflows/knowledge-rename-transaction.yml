name: Knowledge rename transaction

on:
  pull_request:

permissions:
  contents: read

jobs:
  rename-transaction:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: joshing_category_rename_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d joshing_category_rename_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/joshing_category_rename_test
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/joshing_category_rename_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- src/server/knowledge/__tests__/rename-node.pg.test.ts

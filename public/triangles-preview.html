<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Homepage triangles background — preview</title>
    <style>
      /* Palette pulled from src/app/globals.css (Ink-on-Cream) */
      :root {
        --brand-ink: #0a1f3d;
        --brand-ink-700: #3a4a5f;
        --brand-ink-400: #8a8a8a;
        --brand-navy: #1f3a5a;
        --brand-orange: #d15e36;
        --brand-cream-page: #fcf8f2;
        --brand-card: #fdfcfb;
        --brand-border: #e9e2d2;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--brand-cream-page);
        color: var(--brand-ink);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      /* Mirrors the <main> on src/app/page.tsx:
         mx-auto max-w-2xl, px-4 py-6, gap-5, relative */
      .main {
        position: relative;
        max-width: 42rem; /* max-w-2xl */
        margin: 0 auto;
        min-height: 100vh;
        padding: 1.5rem 1rem 8rem; /* py-6 px-4 pb-32 */
        display: flex;
        flex-direction: column;
        gap: 1.25rem; /* gap-5 */
      }

      /* The triangle banner band. Same idea as the homepage:
         a top band, the image cover-scaled and clipped. The ONLY change
         vs. production is the image source (triangles_only.png). */
      .triangle-band {
        position: absolute;
        inset-inline: 0;
        top: 0;
        height: 10rem; /* h-40 */
        overflow: hidden;
        z-index: -10;
        pointer-events: none;
      }

      .triangle-band img {
        position: absolute;
        inset-inline: 0;
        top: 0;
        width: 100%;
        /* The production banner cover-scales to full viewport height (h-screen)
           and crops to the band. triangles_only.png is a wide, already-cropped
           strip, so contain/top reads its full artwork at the band height.
           Toggle the buttons below to compare the two fits. */
        height: auto;
        object-fit: cover;
        object-position: center top;
      }

      body[data-fit="cover-screen"] .triangle-band img {
        height: 100vh;
        object-fit: cover;
        object-position: center;
      }

      body[data-fit="band-contain"] .triangle-band img {
        height: 10rem;
        object-fit: contain;
        object-position: center top;
      }

      body[data-fit="natural-top"] .triangle-band img {
        height: auto;
      }

      /* Cards roughly approximating the home cards so you can see how the
         band sits behind/under the first card. */
      .card {
        background: var(--brand-card);
        border: 1px solid var(--brand-border);
        border-radius: 0.75rem;
        padding: 1.25rem;
        box-shadow: 0 1px 2px rgba(10, 31, 61, 0.04);
      }

      .card h2 {
        margin: 0 0 0.5rem;
        font-size: 1.125rem;
      }

      .card p {
        margin: 0;
        color: var(--brand-ink-700);
        line-height: 1.5;
      }

      .eyebrow {
        margin: 0 0 0.5rem 0.125rem;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--brand-ink-400);
      }

      .play-btn {
        display: inline-block;
        margin-top: 0.75rem;
        background: var(--brand-navy);
        color: #fff;
        border: 0;
        border-radius: 0.5rem;
        padding: 0.625rem 1.25rem;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }

      /* Small preview-only control bar (not part of the real page). */
      .controls {
        position: fixed;
        bottom: 0;
        inset-inline: 0;
        display: flex;
        gap: 0.5rem;
        justify-content: center;
        flex-wrap: wrap;
        padding: 0.75rem;
        background: rgba(10, 31, 61, 0.92);
        z-index: 100;
      }

      .controls button {
        font: inherit;
        font-size: 0.8125rem;
        border: 1px solid rgba(255, 255, 255, 0.25);
        background: transparent;
        color: #fff;
        border-radius: 0.375rem;
        padding: 0.375rem 0.75rem;
        cursor: pointer;
      }

      .controls button[aria-pressed="true"] {
        background: #fff;
        color: var(--brand-navy);
        font-weight: 600;
      }
    </style>
  </head>
  <body data-fit="natural-top">
    <main class="main">
      <div class="triangle-band" aria-hidden="true">
        <img src="images/triangles_only.png" alt="" />
      </div>

      <section class="card">
        <h2>Today's Five</h2>
        <p>
          Five fresh questions are waiting. This card sits on top of the triangle
          band, exactly like the real homepage.
        </p>
        <button class="play-btn" type="button">Play today's round</button>
      </section>

      <p class="eyebrow">For you</p>
      <section class="card">
        <h2>From your friends</h2>
        <p>
          The feed continues below. Use the controls at the bottom to compare how
          the triangle artwork fits the band.
        </p>
      </section>

      <section class="card">
        <h2>More activity</h2>
        <p>Placeholder feed item.</p>
      </section>
    </main>

    <div class="controls" role="group" aria-label="Background fit (preview only)">
      <button type="button" data-set="natural-top" aria-pressed="true">
        Natural width (top)
      </button>
      <button type="button" data-set="cover-screen" aria-pressed="false">
        Cover (production fit)
      </button>
      <button type="button" data-set="band-contain" aria-pressed="false">
        Contain in band
      </button>
    </div>

    <script>
      const buttons = document.querySelectorAll(".controls button");
      buttons.forEach((btn) => {
        btn.addEventListener("click", () => {
          document.body.dataset.fit = btn.dataset.set;
          buttons.forEach((b) =>
            b.setAttribute("aria-pressed", String(b === btn))
          );
        });
      });
    </script>
  </body>
</html>
